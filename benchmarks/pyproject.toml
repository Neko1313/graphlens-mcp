[project]
name = "graphlens-benchmarks"
version = "0.1.0"
description = "A/B benchmark of code-context MCP servers (graphlens / semble / codegraph) plus a no-tools control, driving an identical pydantic-ai agent over OpenRouter models, across Go / Rust / Python / TypeScript codebases."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Agent + MCP client + OpenRouter (OpenAI-compatible) provider.
    "pydantic-ai-slim[openai,mcp]>=1.0.0",
    # Config / orchestration.
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    # Analysis (metrics.ipynb).
    "pandas>=2.2",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    # Paired significance tests (Wilcoxon signed-rank) in metrics.ipynb.
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.uv]
# Not a distributable package — a runnable harness. The `bench` package is imported
# directly when scripts run from this directory (cwd on sys.path), mirroring how the
# reference agent-context-bench imports its `tests` package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
